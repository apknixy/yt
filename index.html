<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AddMint</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>

    <style>
        :root {
            --bg-color-main: #1a1a2e;
            --bg-color-lighter: #16213e;
            --bg-color-darker: #0d2a4a;
            --text-color-main: #e0e0e0;
            --text-color-light: #bbb;
            --border-color-main: #0f3460;
            --highlight-color-main: #00ffff;
            --highlight-color-secondary: #ff00ff;
            --button-primary-bg: #00ffff;
            --button-primary-text: #1a1a2e;
            --error-color: #ff4757;
            --success-color: #2ed573;
        }

        /* General Styles & Resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color-main);
            color: var(--text-color-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color-main);
            border-left: 1px solid var(--border-color-main);
            border-right: 1px solid var(--border-color-main);
        }

        .hidden {
            display: none !important;
        }

        /* Loading Overlay */
        #load-status {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.9);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .loader {
            border: 4px solid var(--bg-color-lighter);
            border-top: 4px solid var(--highlight-color-main);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        #load-status p {
            color: var(--text-color-main);
            font-size: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* App Header */
        .app-header {
            width: 100%;
            height: 50px;
            background-color: var(--bg-color-darker);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            flex-shrink: 0;
            z-index: 100;
        }
        
        .app-header .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--highlight-color-main);
            cursor: pointer;
        }

        .header-actions button {
            background: none;
            border: none;
            color: var(--text-color-main);
            font-size: 1.5rem;
            margin-left: 15px;
            cursor: pointer;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Screens */
        .screen {
            padding: 10px;
        }

        /* Footer Navigation */
        .app-footer {
            width: 100%;
            height: 60px;
            background-color: var(--bg-color-darker);
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-color-light);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s, transform 0.3s;
        }

        .nav-item.active {
            color: var(--highlight-color-main);
            transform: scale(1.1);
        }

        /* Authentication Screen */
        #auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form h2 {
            text-align: center;
            color: var(--highlight-color-main);
            margin-bottom: 20px;
        }
        
        .input-group {
            position: relative;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color-lighter);
            border: 1px solid var(--border-color-main);
            border-radius: 5px;
            color: var(--text-color-main);
            font-size: 1rem;
        }
        
        .auth-form input:focus {
            outline: none;
            border-color: var(--highlight-color-main);
        }

        .auth-btn {
            padding: 12px;
            background-color: var(--button-primary-bg);
            color: var(--button-primary-text);
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .auth-btn:hover {
            opacity: 0.9;
        }
        
        .toggle-auth {
            text-align: center;
            margin-top: 15px;
            color: var(--text-color-light);
        }
        
        .toggle-auth span {
            color: var(--highlight-color-main);
            cursor: pointer;
            font-weight: bold;
        }

        .auth-message {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .auth-message.error {
            background-color: var(--error-color);
            color: white;
        }
        
        .auth-message.success {
            background-color: var(--success-color);
            color: white;
        }

        /* Post Card */
        .post-card {
            background-color: var(--bg-color-lighter);
            border: 1px solid var(--border-color-main);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }
        
        .post-card.neon-glow {
            animation: neonGlow 0.7s ease-in-out;
        }

        @keyframes neonGlow {
            0% { box-shadow: 0 0 5px var(--highlight-color-secondary), 0 0 10px var(--highlight-color-secondary); }
            100% { box-shadow: 0 0 0px transparent, 0 0 0px transparent; }
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 10px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .post-author {
            font-weight: bold;
            color: var(--highlight-color-main);
            cursor: pointer;
        }
        
        .post-content {
            padding: 0 12px 12px 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-content strong { font-weight: bold; }
        .post-content em { font-style: italic; }
        .post-content a {
            color: var(--highlight-color-main);
            text-decoration: none;
        }
        
        .post-content img, .post-content iframe {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .youtube-embed {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            margin: 10px 0;
            border-radius: 8px;
        }

        .youtube-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .post-actions {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            border-top: 1px solid var(--border-color-main);
        }

        .post-actions .action-btn {
            background: none;
            border: none;
            color: var(--text-color-light);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .post-actions .action-btn .icon.liked {
            color: red;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .post-options {
            position: relative;
            margin-left: auto;
        }

        .options-menu {
            position: absolute;
            right: 0;
            top: 30px;
            background: var(--bg-color-darker);
            border-radius: 5px;
            border: 1px solid var(--border-color-main);
            overflow: hidden;
            z-index: 10;
        }

        .options-menu button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            background: none;
            border: none;
            color: var(--text-color-main);
            text-align: left;
            cursor: pointer;
        }

        .options-menu button:hover {
            background: var(--bg-color-lighter);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-color-lighter);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            animation: fadeInScale 0.3s ease-out;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--highlight-color-main);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-color-light);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .modal-body {
            overflow-y: auto;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Edit Profile Modal */
        #edit-profile-modal .input-group {
            margin-bottom: 15px;
        }
        
        #edit-profile-modal label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-color-light);
        }

        #edit-profile-modal input, #edit-profile-modal textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color-darker);
            border: 1px solid var(--border-color-main);
            border-radius: 5px;
            color: var(--text-color-main);
        }

        #edit-profile-modal textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        #username-status {
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        .modal-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .modal-btn.primary {
            background-color: var(--button-primary-bg);
            color: var(--button-primary-text);
        }

        .modal-btn.secondary {
            background-color: var(--bg-color-darker);
            color: var(--text-color-main);
        }

        /* Profile Screen */
        #profile-screen .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 10px;
        }
        
        #profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--highlight-color-main);
        }
        
        #profile-display-name {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        #profile-username {
            color: var(--text-color-light);
        }
        
        #profile-bio {
            text-align: center;
            max-width: 90%;
        }
        
        .profile-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 15px 0;
            background-color: var(--bg-color-lighter);
            border-top: 1px solid var(--border-color-main);
            border-bottom: 1px solid var(--border-color-main);
        }
        
        .stat {
            text-align: center;
            cursor: pointer;
        }
        
        .stat-count {
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .stat-label {
            color: var(--text-color-light);
            font-size: 0.9rem;
        }
        
        .profile-actions {
            padding: 15px;
        }
        
        .profile-btn {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-btn.edit {
            background-color: var(--bg-color-darker);
            color: var(--text-color-main);
            border: 1px solid var(--border-color-main);
        }
        
        .profile-btn.follow {
            background-color: var(--button-primary-bg);
            color: var(--button-primary-text);
        }
        
        .profile-btn.unfollow {
            background-color: var(--bg-color-lighter);
            color: var(--text-color-main);
            border: 1px solid var(--text-color-light);
        }
        
        /* Comments Modal */
        #comments-modal .modal-content {
            height: 90vh;
            max-height: 90vh;
        }

        .comments-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .comment-card {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .comment-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .comment-body {
            background: var(--bg-color-main);
            padding: 8px 12px;
            border-radius: 10px;
            flex-grow: 1;
        }
        
        .comment-username {
            font-weight: bold;
            color: var(--highlight-color-secondary);
            font-size: 0.9rem;
        }

        .comment-content {
            font-size: 0.95rem;
        }
        
        .comment-form {
            display: flex;
            gap: 10px;
        }
        
        .comment-form textarea {
            flex-grow: 1;
            resize: none;
            padding: 10px;
            background-color: var(--bg-color-darker);
            border: 1px solid var(--border-color-main);
            border-radius: 20px;
            color: var(--text-color-main);
            height: 40px;
        }

        .comment-form button {
            padding: 0 15px;
            border-radius: 20px;
            border: none;
            background-color: var(--button-primary-bg);
            color: var(--button-primary-text);
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <!-- Full Screen Loader -->
        <div id="load-status">
            <div class="loader"></div>
            <p>Initializing AddMint...</p>
        </div>

        <!-- Authentication Container (shown when logged out) -->
        <div id="auth-container" class="hidden">
            <!-- Login Form -->
            <div id="login-form" class="auth-form">
                <h2>Login to AddMint</h2>
                <div id="login-message" class="auth-message hidden"></div>
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button id="login-btn" class="auth-btn">Login</button>
                <p class="toggle-auth">No account? <span id="show-signup">Sign Up</span></p>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" class="auth-form hidden">
                <h2>Create Account</h2>
                <div id="signup-message" class="auth-message hidden"></div>
                <div class="input-group">
                    <input type="email" id="signup-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-password" placeholder="Password (min. 6 characters)" required>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                </div>
                <button id="signup-btn" class="auth-btn">Sign Up</button>
                <p class="toggle-auth">Have an account? <span id="show-login">Login</span></p>
            </div>
        </div>

        <!-- Main App Content (shown when logged in) -->
        <div id="main-app" class="hidden">
            <header class="app-header">
                <div class="logo">AddMint</div>
                <div class="header-actions">
                    <button id="refresh-feed-btn">🔄</button>
                    <button id="logout-btn">🚪</button>
                </div>
            </header>
            
            <main class="main-content">
                <!-- Home Screen -->
                <div id="home-screen" class="screen">
                    <!-- Posts will be injected here -->
                </div>
                
                <!-- Profile Screen -->
                <div id="profile-screen" class="screen hidden">
                    <div class="profile-header">
                        <img id="profile-avatar" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Profile Avatar">
                        <h2 id="profile-display-name"></h2>
                        <p id="profile-username"></p>
                        <p id="profile-bio"></p>
                    </div>
                    <div class="profile-stats">
                        <div class="stat" id="profile-posts-stat">
                            <div id="profile-post-count" class="stat-count">0</div>
                            <div class="stat-label">Posts</div>
                        </div>
                        <div class="stat" id="profile-followers-stat">
                            <div id="profile-followers-count" class="stat-count">0</div>
                            <div class="stat-label">Followers</div>
                        </div>
                        <div class="stat" id="profile-following-stat">
                            <div id="profile-following-count" class="stat-count">0</div>
                            <div class="stat-label">Following</div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button id="profile-main-btn" class="profile-btn"></button>
                    </div>
                    <div id="profile-posts-feed" class="posts-feed">
                        <!-- User's posts will be injected here -->
                    </div>
                </div>
                
                <!-- Monetization Screen -->
                <div id="monetization-screen" class="screen hidden">
                    <h3>Monetization</h3>
                    <!-- Content here -->
                </div>
                
                <!-- Notifications Screen -->
                <div id="notifications-screen" class="screen hidden">
                    <h3>Notifications</h3>
                    <!-- Content here -->
                </div>
            </main>

            <footer class="app-footer">
                <button class="nav-item active" data-screen="home-screen">🏠</button>
                <button class="nav-item" data-screen="monetization-screen">💰</button>
                <button class="nav-item" data-screen="notifications-screen">🔔</button>
                <button class="nav-item" id="nav-profile-btn">👤</button>
            </footer>
        </div>

        <!-- Modals -->
        <div id="edit-profile-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Profile</h3>
                    <button id="edit-profile-close-btn" class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label for="edit-username">Username</label>
                        <input type="text" id="edit-username" placeholder="Unique username (no spaces)">
                        <p id="username-status"></p>
                    </div>
                    <div class="input-group">
                        <label for="edit-display-name">Display Name</label>
                        <input type="text" id="edit-display-name" placeholder="Your display name">
                    </div>
                    <div class="input-group">
                        <label for="edit-bio">Bio</label>
                        <textarea id="edit-bio" maxlength="150" placeholder="Tell us about yourself"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="edit-avatar-url">Profile Picture URL</label>
                        <input type="text" id="edit-avatar-url" placeholder="https://example.com/image.png">
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="edit-profile-cancel-btn" class="modal-btn secondary">Cancel</button>
                    <button id="edit-profile-save-btn" class="modal-btn primary">Save</button>
                </div>
            </div>
        </div>
        
        <div id="comments-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Comments</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="comments-list">
                    <!-- Comments will be injected here -->
                </div>
                <form class="comment-form" id="comment-form">
                    <textarea id="comment-input" placeholder="Add a comment..." maxlength="100"></textarea>
                    <button type="submit">Post</button>
                </form>
            </div>
        </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- START: Firebase Configuration ---
        // IMPORTANT: REPLACE WITH YOUR FIREBASE PROJECT CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDlZA4grzF3fx95-11E4s7ASXwkIij1k1w",
            authDomain: "addmint-7ab6b.firebaseapp.com",
            projectId: "addmint-7ab6b",
            storageBucket: "addmint-7ab6b.firebasestorage.app",
            messagingSenderId: "504015450137",
            appId: "1:504015450137:web:694b176313582cce1e7a88",
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const functions = firebase.functions();
        // --- END: Firebase Configuration ---


        // --- START: Global State & Element Selectors ---
        let currentUser = null;
        let lastVisiblePost = null;
        let isFetchingPosts = false;
        
        const loader = document.getElementById('load-status');
        const authContainer = document.getElementById('auth-container');
        const mainApp = document.getElementById('main-app');
        
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');

        const homeScreen = document.getElementById('home-screen');
        const profileScreen = document.getElementById('profile-screen');
        // Add other screen selectors here...

        const editProfileModal = document.getElementById('edit-profile-modal');
        const commentsModal = document.getElementById('comments-modal');
        // --- END: Global State & Element Selectors ---

        
        // --- START: Authentication Logic ---
        auth.onAuthStateChanged(async user => {
            loader.classList.remove('hidden');
            if (user) {
                if (user.emailVerified) {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUser = { uid: user.uid, ...userDoc.data() };
                        if (!currentUser.username) {
                           // First time login: force profile setup
                           showEditProfileModal(true);
                        } else {
                           initializeAppUI();
                        }
                    } else {
                        // Create user profile document if it doesn't exist
                        await setupNewUser(user);
                        showEditProfileModal(true); // Force setup
                    }
                } else {
                    // User's email is not verified
                    currentUser = null;
                    showAuthScreen();
                    displayAuthMessage('login-message', 'Please verify your email before logging in. A new verification link has been sent.', 'error');
                    user.sendEmailVerification(); // Resend verification
                    auth.signOut();
                }
            } else {
                // User is signed out
                currentUser = null;
                showAuthScreen();
            }
        });

        async function setupNewUser(user) {
            const newUser = {
                uid: user.uid,
                email: user.email,
                username: null,
                name: "New User",
                bio: "",
                profilePicUrl: `https://avatar.iran.liara.run/public/boy?username=${user.uid}`,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                postCount: 0,
                totalMonetizedViews: 0,
                followers: [],
                following: [],
                followersCount: 0,
                followingCount: 0,
            };
            await db.collection('users').doc(user.uid).set(newUser);
            currentUser = newUser;
        }

        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            if (password !== confirmPassword) {
                displayAuthMessage('signup-message', 'Passwords do not match.', 'error');
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                await userCredential.user.sendEmailVerification();
                await setupNewUser(userCredential.user);
                auth.signOut();
                displayAuthMessage('signup-message', 'Account created! Please check your email to verify your account before logging in.', 'success');
                toggleAuthForms();
            } catch (error) {
                displayAuthMessage('signup-message', error.message, 'error');
            }
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            auth.signInWithEmailAndPassword(email, password).catch(error => {
                displayAuthMessage('login-message', error.message, 'error');
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut();
        });

        function displayAuthMessage(form, message, type) {
            const messageEl = document.getElementById(form);
            messageEl.textContent = message;
            messageEl.className = `auth-message ${type}`;
            messageEl.classList.remove('hidden');
        }
        
        document.getElementById('show-signup').addEventListener('click', () => toggleAuthForms(true));
        document.getElementById('show-login').addEventListener('click', () => toggleAuthForms(false));

        function toggleAuthForms(showSignup = true) {
            loginForm.classList.toggle('hidden', showSignup);
            signupForm.classList.toggle('hidden', !showSignup);
            document.getElementById('login-message').classList.add('hidden');
            document.getElementById('signup-message').classList.add('hidden');
        }

        function showAuthScreen() {
            authContainer.classList.remove('hidden');
            mainApp.classList.add('hidden');
            loader.classList.add('hidden');
        }

        function initializeAppUI() {
            authContainer.classList.add('hidden');
            mainApp.classList.remove('hidden');
            loader.classList.add('hidden');
            // Initial load of posts
            fetchPosts(); 
            setupNavigation();
        }
        // --- END: Authentication Logic ---
        

        // --- START: UI Navigation & Modals ---
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const screens = document.querySelectorAll('.main-content .screen');

            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const targetScreenId = item.dataset.screen;
                    
                    navItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    
                    screens.forEach(s => s.classList.add('hidden'));
                    document.getElementById(targetScreenId).classList.remove('hidden');
                    
                    if(targetScreenId === 'home-screen' && homeScreen.innerHTML.trim() === '') {
                        fetchPosts(true); // Refresh if switching to an empty home
                    }
                });
            });
            
            document.getElementById('nav-profile-btn').addEventListener('click', () => {
                 document.querySelector('.nav-item.active').classList.remove('active');
                 document.getElementById('nav-profile-btn').classList.add('active');
                 screens.forEach(s => s.classList.add('hidden'));
                 profileScreen.classList.remove('hidden');
                 loadUserProfile(currentUser.uid);
            });
        }
        
        function showEditProfileModal(isFirstTime = false) {
            document.getElementById('edit-username').value = currentUser.username || '';
            document.getElementById('edit-display-name').value = currentUser.name || '';
            document.getElementById('edit-bio').value = currentUser.bio || '';
            document.getElementById('edit-avatar-url').value = currentUser.profilePicUrl || '';

            const cancelBtn = document.getElementById('edit-profile-cancel-btn');
            const closeBtn = document.getElementById('edit-profile-close-btn');

            if (isFirstTime) {
                cancelBtn.classList.add('hidden');
                closeBtn.classList.add('hidden');
            } else {
                cancelBtn.classList.remove('hidden');
                closeBtn.classList.remove('hidden');
            }
            editProfileModal.classList.add('active');
        }
        
        document.getElementById('edit-profile-close-btn').addEventListener('click', () => editProfileModal.classList.remove('active'));
        document.getElementById('edit-profile-cancel-btn').addEventListener('click', () => editProfileModal.classList.remove('active'));

        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.target.closest('.modal').classList.remove('active');
            });
        });

        // --- END: UI Navigation & Modals ---


        // --- START: Profile Logic ---
        
        async function loadUserProfile(userId) {
            // ... load user profile data and display it
            const userDoc = await db.collection('users').doc(userId).get();
            if(!userDoc.exists) return;
            const userData = userDoc.data();

            document.getElementById('profile-avatar').src = userData.profilePicUrl;
            document.getElementById('profile-display-name').textContent = userData.name;
            document.getElementById('profile-username').textContent = `@${userData.username}`;
            document.getElementById('profile-bio').textContent = userData.bio;
            document.getElementById('profile-post-count').textContent = userData.postCount || 0;
            document.getElementById('profile-followers-count').textContent = userData.followersCount || 0;
            document.getElementById('profile-following-count').textContent = userData.followingCount || 0;

            const mainBtn = document.getElementById('profile-main-btn');
            if(userId === currentUser.uid) {
                mainBtn.textContent = 'Edit Profile';
                mainBtn.className = 'profile-btn edit';
                mainBtn.onclick = () => showEditProfileModal();
            } else {
                // follow/unfollow logic here
            }
            
            // Load user's posts
            loadUserPosts(userId);
        }

        async function loadUserPosts(userId) {
            const feed = document.getElementById('profile-posts-feed');
            feed.innerHTML = '<div class="loader" style="margin: 20px auto;"></div>';
            const snapshot = await db.collection('posts').where('userId', '==', userId).orderBy('timestamp', 'desc').limit(20).get();
            
            feed.innerHTML = '';
            if (snapshot.empty) {
                feed.innerHTML = '<p style="text-align:center; color: var(--text-color-light);">No posts yet.</p>';
                return;
            }
            snapshot.forEach(doc => {
                const postEl = createPostElement(doc.id, doc.data());
                feed.appendChild(postEl);
            });
        }
        
        document.getElementById('edit-profile-save-btn').addEventListener('click', async () => {
            // Save profile logic
             const newUsername = document.getElementById('edit-username').value.toLowerCase().trim();
             const newName = document.getElementById('edit-display-name').value.trim();
             const newBio = document.getElementById('edit-bio').value.trim();
             const newAvatar = document.getElementById('edit-avatar-url').value.trim();
             
             // Basic validation
             if (!newUsername || !newName) {
                alert('Username and Display Name are required.');
                return;
             }
             
             // Check if username is available (if changed)
             if (newUsername !== currentUser.username) {
                const usernameDoc = await db.collection('usernames').doc(newUsername).get();
                if (usernameDoc.exists) {
                    alert('Username is already taken.');
                    return;
                }
             }

             const oldUsername = currentUser.username;

             const updatedData = {
                username: newUsername,
                name: newName,
                bio: newBio,
                profilePicUrl: newAvatar,
             };

             await db.collection('users').doc(currentUser.uid).update(updatedData);

             // Update username collection for uniqueness
             const batch = db.batch();
             if(oldUsername) {
                const oldUsernameRef = db.collection('usernames').doc(oldUsername);
                batch.delete(oldUsernameRef);
             }
             const newUsernameRef = db.collection('usernames').doc(newUsername);
             batch.set(newUsernameRef, { uid: currentUser.uid });
             await batch.commit();

             currentUser = { ...currentUser, ...updatedData };
             editProfileModal.classList.remove('active');
             
             // If this was the first time setup, initialize the app
             if (mainApp.classList.contains('hidden')) {
                initializeAppUI();
             } else {
                loadUserProfile(currentUser.uid); // Refresh profile view
             }
        });

        // --- END: Profile Logic ---


        // --- START: Home Feed & Post Logic ---
        async function fetchPosts(isRefresh = false) {
            if (isFetchingPosts) return;
            isFetchingPosts = true;

            if (isRefresh) {
                lastVisiblePost = null;
                homeScreen.innerHTML = '';
            }
            
            const loaderEl = document.createElement('div');
            loaderEl.className = 'loader';
            loaderEl.style.margin = '20px auto';
            homeScreen.appendChild(loaderEl);

            try {
                let query = db.collection('posts')
                              .orderBy('timestamp', 'desc')
                              .limit(10);
                
                if (lastVisiblePost) {
                    query = query.startAfter(lastVisiblePost);
                }

                const snapshot = await snapshot.get();

                loaderEl.remove();
                
                if(snapshot.empty && !lastVisiblePost) {
                    homeScreen.innerHTML = '<p style="text-align:center; color: var(--text-color-light);">No posts to show. Follow people to see their posts here!</p>';
                } else if(snapshot.empty && lastVisiblePost) {
                    // Reached end of feed, loop back
                    lastVisiblePost = null;
                    fetchPosts(); // Start from beginning
                    return;
                }
                
                lastVisiblePost = snapshot.docs[snapshot.docs.length - 1];
                
                snapshot.forEach(doc => {
                    const postEl = createPostElement(doc.id, doc.data());
                    homeScreen.appendChild(postEl);
                });

            } catch (error) {
                console.error("Error fetching posts:", error);
                loaderEl.remove();
                homeScreen.innerHTML += '<p style="text-align:center; color: var(--error-color);">Could not fetch posts.</p>';
            }

            isFetchingPosts = false;
        }
        
        function createPostElement(postId, postData) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.dataset.postId = postId;

            const isLiked = postData.likes.includes(currentUser.uid);

            card.innerHTML = `
                <div class="post-header">
                    <img src="${postData.authorAvatarUrl}" alt="avatar" class="post-avatar">
                    <span class="post-author">@${postData.username}</span>
                    <div class="post-options">
                        <button class="options-btn">⋮</button>
                        <div class="options-menu hidden">
                           <!-- Options here -->
                        </div>
                    </div>
                </div>
                <div class="post-content">${renderRichText(postData.content)}</div>
                <div class="post-actions">
                    <button class="action-btn like-btn">
                        <span class="icon ${isLiked ? 'liked' : ''}">❤</span>
                        <span class="count">${postData.likesCount || 0}</span>
                    </button>
                    <button class="action-btn comment-btn">
                        <span class="icon">💬</span>
                        <span class="count">${postData.commentCount || 0}</span>
                    </button>
                    <button class="action-btn">
                        <span class="icon">👁️</span>
                        <span class="count">${postData.views || 0}</span>
                    </button>
                </div>
            `;
            
            // Add event listeners
            card.querySelector('.like-btn').addEventListener('click', () => toggleLike(postId, card));
            card.addEventListener('dblclick', (e) => {
                if(!e.target.closest('.post-actions')){
                   toggleLike(postId, card);
                   card.classList.add('neon-glow');
                   setTimeout(() => card.classList.remove('neon-glow'), 700);
                }
            });

            return card;
        }
        
        function renderRichText(text) {
            let html = text;
            // Image embeds
            html = html.replace(/(https?:\/\/\S+\.(?:png|jpg|jpeg|gif))/gi, '<img src="$1" alt="post image">');
            // YouTube embeds
            html = html.replace(/https?:\/\/(?:www\.)?youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/gi, 
                '<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/$1" frameborder="0" allowfullscreen></iframe></div>');
            // Clickable links
            html = html.replace(/(?<!href=")(?<!src=")(https?:\/\/[^\s<]+)/gi, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
            // Bold and Italic
            // Note: This is a very simple parser. More complex scenarios may need a more robust solution.
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return html;
        }

        async function toggleLike(postId, cardElement) {
            const postRef = db.collection('posts').doc(postId);
            const likeBtn = cardElement.querySelector('.like-btn .icon');
            const likeCountEl = cardElement.querySelector('.like-btn .count');

            await db.runTransaction(async (transaction) => {
                const postDoc = await transaction.get(postRef);
                if (!postDoc.exists) {
                    throw "Document does not exist!";
                }

                const postData = postDoc.data();
                const likes = postData.likes || [];
                let newLikesCount = postData.likesCount || 0;
                
                if (likes.includes(currentUser.uid)) {
                    // Unlike
                    transaction.update(postRef, {
                        likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid),
                        likesCount: firebase.firestore.FieldValue.increment(-1)
                    });
                    newLikesCount--;
                    likeBtn.classList.remove('liked');
                } else {
                    // Like
                    transaction.update(postRef, {
                        likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
                        likesCount: firebase.firestore.FieldValue.increment(1)
                    });
                    newLikesCount++;
                    likeBtn.classList.add('liked');
                    likeBtn.style.animation = 'none';
                    likeBtn.offsetHeight; /* trigger reflow */
                    likeBtn.style.animation = 'bounceIn 0.5s';
                }
                 likeCountEl.textContent = newLikesCount;
            });
        }
        
        // Infinite scroll listener
        document.querySelector('.main-content').addEventListener('scroll', (e) => {
            const { scrollTop, scrollHeight, clientHeight } = e.target;
            // Load more when 80% scrolled
            if (scrollTop + clientHeight >= scrollHeight * 0.8 && !isFetchingPosts) {
                fetchPosts();
            }
        });
        
        // --- END: Home Feed & Post Logic ---

    });
    </script>
